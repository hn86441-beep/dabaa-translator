<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dabaa Translator Pro | المترجم الاحترافي</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/framer-motion/10.16.4/framer-motion.umd.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Tajawal', sans-serif; background-color: #f0f2f5; transition: all 0.3s ease; }
        .glass { background: rgba(255, 255, 255, 0.8); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.3); }
        .dark-mode { background-color: #0b0f19; color: #e2e8f0; }
        .dark-mode .glass { background: rgba(17, 24, 39, 0.8); border-color: rgba(255, 255, 255, 0.1); }
        .dark-mode textarea, .dark-mode select { background-color: #1f2937; color: white; border-color: #374151; }
        .loader { border-top-color: #3b82f6; animation: spinner 1s linear infinite; }
        @keyframes spinner { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        .gradient-text { background: linear-gradient(45deg, #3b82f6, #8b5cf6); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .btn-primary { background: linear-gradient(45deg, #3b82f6, #2563eb); transition: all 0.3s ease; }
        .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 10px 20px -10px rgba(59, 130, 246, 0.5); }
    </style>
</head>
<body class="min-h-screen">
    <div class="p-4 md:p-10">
        <!-- Header -->
        <header class="max-w-6xl mx-auto flex justify-between items-center mb-10">
            <div class="flex items-center gap-4">
                <div class="bg-blue-600 p-3 rounded-2xl shadow-xl rotate-3 hover:rotate-0 transition-transform">
                    <i data-lucide="languages" class="text-white w-8 h-8"></i>
                </div>
                <div>
                    <h1 class="text-3xl font-black text-slate-800 dark:text-white tracking-tight">Dabaa <span class="gradient-text">Translator</span></h1>
                    <p class="text-xs text-slate-500 font-medium">Powered by DeepL & Groq AI</p>
                </div>
            </div>
            <div class="flex items-center gap-3">
                <button id="themeToggle" class="p-3 rounded-xl glass hover:bg-white dark:hover:bg-slate-800 transition-all">
                    <i data-lucide="moon" id="themeIcon" class="w-6 h-6"></i>
                </button>
            </div>
        </header>

        <main class="max-w-6xl mx-auto space-y-8">
            <!-- Toolbar -->
            <div class="glass p-3 rounded-2xl shadow-sm flex flex-wrap items-center justify-between gap-4 px-6">
                <div class="flex items-center gap-3">
                    <select id="sourceLang" class="bg-transparent font-bold text-slate-600 dark:text-slate-300 outline-none cursor-pointer">
                        <option value="auto">تحديد تلقائي</option>
                        <option value="AR">العربية</option>
                        <option value="EN">الإنجليزية</option>
                        <option value="DE">الألمانية</option>
                        <option value="FR">الفرنسية</option>
                        <option value="ES">الإسبانية</option>
                    </select>
                    <button id="swapLangs" class="p-2 rounded-full hover:bg-blue-50 dark:hover:bg-blue-900/20 text-blue-500 transition-colors">
                        <i data-lucide="arrow-left-right" class="w-5 h-5"></i>
                    </button>
                    <select id="targetLang" class="bg-transparent font-bold text-slate-600 dark:text-slate-300 outline-none cursor-pointer">
                        <option value="AR" selected>العربية</option>
                        <option value="EN">الإنجليزية</option>
                        <option value="DE">الألمانية</option>
                        <option value="FR">الفرنسية</option>
                        <option value="ES">الإسبانية</option>
                    </select>
                </div>
                <div class="flex gap-2">
                    <button id="clearBtn" class="text-xs font-bold text-slate-400 hover:text-red-500 flex items-center gap-1">
                        <i data-lucide="trash-2" class="w-4 h-4"></i> مسح الكل
                    </button>
                </div>
            </div>

            <!-- Main Workspace -->
            <div class="grid grid-cols-1 lg:grid-cols-2 gap-8">
                <!-- Input Panel -->
                <div class="space-y-4">
                    <div class="glass p-6 rounded-[2.5rem] shadow-2xl relative overflow-hidden group">
                        <div class="absolute top-0 right-0 w-32 h-32 bg-blue-500/5 rounded-full -mr-16 -mt-16 transition-all group-hover:scale-150"></div>
                        <textarea id="inputText" placeholder="اكتب شيئاً مبدعاً هنا..." class="w-full h-72 bg-transparent resize-none text-xl outline-none placeholder:text-slate-300 leading-relaxed" spellcheck="false"></textarea>
                        
                        <div class="flex justify-between items-center mt-6">
                            <div class="flex gap-3">
                                <button title="ترجمة من الكاميرا" id="cameraBtn" class="p-3 bg-slate-100 dark:bg-slate-800 rounded-2xl hover:bg-blue-600 hover:text-white transition-all">
                                    <i data-lucide="camera" class="w-6 h-6"></i>
                                </button>
                                <label title="ترجمة ملف SRT" class="p-3 bg-slate-100 dark:bg-slate-800 rounded-2xl hover:bg-blue-600 hover:text-white cursor-pointer transition-all">
                                    <i data-lucide="file-up" class="w-6 h-6"></i>
                                    <input type="file" id="srtUpload" accept=".srt" class="hidden">
                                </label>
                            </div>
                            <span id="charCount" class="text-xs font-bold text-slate-400 bg-slate-100 dark:bg-slate-800 px-3 py-1 rounded-full">0 / 5000</span>
                        </div>
                    </div>
                </div>

                <!-- Output Panel -->
                <div class="space-y-4">
                    <div class="glass p-6 rounded-[2.5rem] shadow-2xl bg-gradient-to-br from-white to-slate-50 dark:from-slate-900 dark:to-slate-800 relative overflow-hidden">
                        <div id="outputContainer" class="w-full h-72 overflow-y-auto text-xl leading-relaxed text-slate-700 dark:text-slate-200">
                            <p id="placeholderText" class="text-slate-300 italic">الترجمة ستظهر هنا...</p>
                            <div id="outputText" class="whitespace-pre-wrap"></div>
                        </div>
                        
                        <div class="flex justify-between items-center mt-6">
                            <div class="flex gap-2">
                                <button id="speakBtn" class="p-3 hover:bg-blue-50 dark:hover:bg-blue-900/20 rounded-xl text-slate-400 hover:text-blue-500 transition-all">
                                    <i data-lucide="volume-2" class="w-6 h-6"></i>
                                </button>
                                <button id="copyBtn" class="p-3 hover:bg-blue-50 dark:hover:bg-blue-900/20 rounded-xl text-slate-400 hover:text-blue-500 transition-all">
                                    <i data-lucide="copy" class="w-6 h-6"></i>
                                </button>
                            </div>
                            <div id="statusIndicator" class="hidden flex items-center gap-2 text-xs font-bold text-blue-500">
                                <div class="loader w-4 h-4 border-2 border-blue-200 rounded-full"></div> جاري العمل...
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Action Center -->
            <div class="flex flex-col items-center gap-4">
                <button id="translateBtn" class="btn-primary text-white px-16 py-5 rounded-3xl font-black text-2xl shadow-2xl flex items-center gap-4 group">
                    <span>ترجمة فورية</span>
                    <i data-lucide="sparkles" class="w-7 h-7 group-hover:rotate-12 transition-transform"></i>
                </button>
                <p id="errorMsg" class="text-red-500 text-sm font-bold hidden"></p>
            </div>
        </main>

        <!-- Camera Modal -->
        <div id="cameraModal" class="fixed inset-0 bg-slate-900/90 z-50 hidden backdrop-blur-sm flex items-center justify-center p-4">
            <div class="bg-white dark:bg-slate-900 rounded-[3rem] p-8 max-w-2xl w-full shadow-2xl border border-white/10">
                <div class="flex justify-between items-center mb-6">
                    <h3 class="text-2xl font-black flex items-center gap-2"><i data-lucide="scan-text" class="text-blue-500"></i> مسح ضوئي ذكي</h3>
                    <button id="closeCamera" class="p-2 hover:bg-slate-100 dark:hover:bg-slate-800 rounded-full"><i data-lucide="x" class="w-6 h-6"></i></button>
                </div>
                <div class="relative rounded-[2rem] overflow-hidden bg-black aspect-video shadow-inner">
                    <video id="video" class="w-full h-full object-cover" autoplay playsinline></video>
                    <div class="absolute inset-0 border-2 border-blue-500/30 border-dashed m-8 rounded-2xl pointer-events-none animate-pulse"></div>
                </div>
                <canvas id="canvas" class="hidden"></canvas>
                <div class="mt-8 flex justify-center">
                    <button id="captureBtn" class="bg-blue-600 text-white w-20 h-20 rounded-full shadow-2xl hover:scale-110 active:scale-95 transition-all flex items-center justify-center border-8 border-white dark:border-slate-800">
                        <i data-lucide="camera" class="w-8 h-8"></i>
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script>
        lucide.createIcons();

        const elements = {
            themeToggle: document.getElementById('themeToggle'),
            themeIcon: document.getElementById('themeIcon'),
            translateBtn: document.getElementById('translateBtn'),
            inputText: document.getElementById('inputText'),
            outputText: document.getElementById('outputText'),
            placeholderText: document.getElementById('placeholderText'),
            sourceLang: document.getElementById('sourceLang'),
            targetLang: document.getElementById('targetLang'),
            charCount: document.getElementById('charCount'),
            statusIndicator: document.getElementById('statusIndicator'),
            errorMsg: document.getElementById('errorMsg'),
            cameraBtn: document.getElementById('cameraBtn'),
            cameraModal: document.getElementById('cameraModal'),
            closeCamera: document.getElementById('closeCamera'),
            video: document.getElementById('video'),
            canvas: document.getElementById('canvas'),
            captureBtn: document.getElementById('captureBtn'),
            clearBtn: document.getElementById('clearBtn'),
            copyBtn: document.getElementById('copyBtn'),
            speakBtn: document.getElementById('speakBtn')
        };

        // Theme
        elements.themeToggle.addEventListener('click', () => {
            document.body.classList.toggle('dark-mode');
            const isDark = document.body.classList.contains('dark-mode');
            elements.themeIcon.setAttribute('data-lucide', isDark ? 'sun' : 'moon');
            lucide.createIcons();
        });

        // Char Count
        elements.inputText.addEventListener('input', () => {
            elements.charCount.textContent = `${elements.inputText.value.length} / 5000`;
            if (elements.inputText.value.length > 0) elements.placeholderText.classList.add('hidden');
            else elements.placeholderText.classList.remove('hidden');
        });

        // Clear
        elements.clearBtn.addEventListener('click', () => {
            elements.inputText.value = '';
            elements.outputText.innerText = '';
            elements.placeholderText.classList.remove('hidden');
            elements.inputText.dispatchEvent(new Event('input'));
        });

        // Main Translation Logic
        elements.translateBtn.addEventListener('click', async () => {
            const text = elements.inputText.value.trim();
            if (!text) return;

            elements.translateBtn.disabled = true;
            elements.statusIndicator.classList.remove('hidden');
            elements.errorMsg.classList.add('hidden');
            elements.outputText.style.opacity = '0.5';

            try {
                const response = await fetch('/api/translate', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        text: text,
                        source: elements.sourceLang.value,
                        target: elements.targetLang.value
                    })
                });

                if (!response.ok) {
                    const errData = await response.json();
                    throw new Error(errData.detail || `Server error: ${response.status}`);
                }

                const data = await response.json();
                elements.outputText.innerText = data.translated_text;
                elements.placeholderText.classList.add('hidden');
            } catch (error) {
                console.error('Translation Error:', error);
                elements.errorMsg.innerText = `خطأ: ${error.message}. تأكد من إعداد المفاتيح السرية في Vercel.`;
                elements.errorMsg.classList.remove('hidden');
            } finally {
                elements.translateBtn.disabled = false;
                elements.statusIndicator.classList.add('hidden');
                elements.outputText.style.opacity = '1';
            }
        });

        // SRT Upload
        document.getElementById('srtUpload').addEventListener('change', async (e) => {
            const file = e.target.files[0];
            if (!file) return;

            elements.statusIndicator.classList.remove('hidden');
            elements.outputText.innerText = 'جاري معالجة ملف الترجمة...';

            const formData = new FormData();
            formData.append('file', file);
            formData.append('target', elements.targetLang.value);

            try {
                const response = await fetch('/api/translate-srt', {
                    method: 'POST',
                    body: formData
                });

                if (!response.ok) throw new Error('فشل في ترجمة الملف');

                const blob = await response.blob();
                const url = window.URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = `translated_${file.name}`;
                a.click();
                elements.outputText.innerText = 'تمت الترجمة بنجاح وتم تحميل الملف!';
            } catch (error) {
                elements.errorMsg.innerText = 'حدث خطأ أثناء ترجمة ملف SRT.';
                elements.errorMsg.classList.remove('hidden');
            } finally {
                elements.statusIndicator.classList.add('hidden');
            }
        });

        // Camera Logic
        elements.cameraBtn.addEventListener('click', async () => {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } });
                elements.video.srcObject = stream;
                elements.cameraModal.classList.remove('hidden');
            } catch (err) {
                alert('لا يمكن الوصول للكاميرا: ' + err.message);
            }
        });

        elements.closeCamera.addEventListener('click', () => {
            const stream = elements.video.srcObject;
            if (stream) stream.getTracks().forEach(t => t.stop());
            elements.cameraModal.classList.add('hidden');
        });

        elements.captureBtn.addEventListener('click', async () => {
            const context = elements.canvas.getContext('2d');
            elements.canvas.width = elements.video.videoWidth;
            elements.canvas.height = elements.video.videoHeight;
            context.drawImage(elements.video, 0, 0);
            
            const imageData = elements.canvas.toDataURL('image/jpeg');
            elements.closeCamera.click();
            
            elements.statusIndicator.classList.remove('hidden');
            elements.outputText.innerText = 'جاري تحليل الصورة واستخراج النص...';

            try {
                const response = await fetch('/api/vision', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ image: imageData })
                });
                const data = await response.json();
                elements.inputText.value = data.text;
                elements.inputText.dispatchEvent(new Event('input'));
                elements.outputText.innerText = 'تم استخراج النص بنجاح.';
            } catch (error) {
                elements.errorMsg.innerText = 'فشل التعرف على النص من الصورة.';
                elements.errorMsg.classList.remove('hidden');
            } finally {
                elements.statusIndicator.classList.add('hidden');
            }
        });

        // Utils
        elements.copyBtn.addEventListener('click', () => {
            navigator.clipboard.writeText(elements.outputText.innerText);
            const originalIcon = elements.copyBtn.innerHTML;
            elements.copyBtn.innerHTML = '<i data-lucide="check" class="w-6 h-6 text-green-500"></i>';
            lucide.createIcons();
            setTimeout(() => {
                elements.copyBtn.innerHTML = originalIcon;
                lucide.createIcons();
            }, 2000);
        });

        elements.speakBtn.addEventListener('click', () => {
            const text = elements.outputText.innerText;
            if (!text) return;
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = elements.targetLang.value === 'AR' ? 'ar-SA' : 'en-US';
            window.speechSynthesis.speak(utterance);
        });
    </script>
</body>
</html>
