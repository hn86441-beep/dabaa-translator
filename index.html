<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dabaa Translator | المترجم الذكي</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Tajawal', sans-serif; background-color: #f8fafc; }
        .glass { background: rgba(255, 255, 255, 0.9); backdrop-filter: blur(10px); }
        .dark-mode { background-color: #0f172a; color: #f8fafc; }
        .dark-mode .glass { background: rgba(30, 41, 59, 0.9); border-color: #334155; }
        .dark-mode textarea, .dark-mode select { background-color: #1e293b; color: white; border-color: #334155; }
        .loader { border-top-color: #3b82f6; animation: spinner 1.5s linear infinite; }
        @keyframes spinner { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body class="transition-colors duration-300">
    <div class="min-h-screen p-4 md:p-8">
        <!-- Header -->
        <header class="max-w-6xl mx-auto flex justify-between items-center mb-8">
            <div class="flex items-center gap-3">
                <div class="bg-blue-600 p-2 rounded-xl shadow-lg">
                    <i data-lucide="languages" class="text-white w-6 h-6"></i>
                </div>
                <h1 class="text-2xl font-bold text-slate-800 dark:text-white">Dabaa <span class="text-blue-600">Translator</span></h1>
            </div>
            <button id="themeToggle" class="p-2 rounded-full hover:bg-slate-200 dark:hover:bg-slate-700 transition-colors">
                <i data-lucide="moon" id="themeIcon" class="w-6 h-6"></i>
            </button>
        </header>

        <main class="max-w-6xl mx-auto space-y-6">
            <!-- Language Selection -->
            <div class="glass p-4 rounded-2xl shadow-sm border border-slate-200 flex flex-wrap items-center justify-center gap-4">
                <div class="flex items-center gap-2">
                    <label class="text-sm font-medium text-slate-500">من:</label>
                    <select id="sourceLang" class="bg-white border border-slate-300 rounded-lg px-3 py-2 focus:ring-2 focus:ring-blue-500 outline-none">
                        <option value="auto">تعرف تلقائي</option>
                        <option value="AR">العربية</option>
                        <option value="EN">الإنجليزية</option>
                        <option value="DE">الألمانية</option>
                        <option value="FR">الفرنسية</option>
                        <option value="ES">الإسبانية</option>
                        <option value="IT">الإيطالية</option>
                        <option value="JA">اليابانية</option>
                        <option value="ZH">الصينية</option>
                        <option value="RU">الروسية</option>
                        <option value="TR">التركية</option>
                    </select>
                </div>
                
                <button id="swapLangs" class="p-2 rounded-full hover:bg-slate-100 dark:hover:bg-slate-800">
                    <i data-lucide="repeat-2" class="w-5 h-5 text-slate-400"></i>
                </button>

                <div class="flex items-center gap-2">
                    <label class="text-sm font-medium text-slate-500">إلى:</label>
                    <select id="targetLang" class="bg-white border border-slate-300 rounded-lg px-3 py-2 focus:ring-2 focus:ring-blue-500 outline-none">
                        <option value="AR" selected>العربية</option>
                        <option value="EN">الإنجليزية</option>
                        <option value="DE">الألمانية</option>
                        <option value="FR">الفرنسية</option>
                        <option value="ES">الإسبانية</option>
                        <option value="IT">الإيطالية</option>
                        <option value="JA">اليابانية</option>
                        <option value="ZH">الصينية</option>
                        <option value="RU">الروسية</option>
                        <option value="TR">التركية</option>
                    </select>
                </div>
            </div>

            <!-- Translation Area -->
            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                <!-- Input -->
                <div class="glass p-6 rounded-3xl shadow-xl border border-slate-200 relative">
                    <textarea id="inputText" placeholder="أدخل النص هنا للترجمة..." class="w-full h-64 bg-transparent resize-none text-lg outline-none placeholder:text-slate-400" spellcheck="false"></textarea>
                    <div class="flex justify-between items-center mt-4">
                        <div class="flex gap-2">
                            <button title="كاميرا (OCR)" id="cameraBtn" class="p-2 text-slate-500 hover:text-blue-600 hover:bg-blue-50 rounded-lg transition-all">
                                <i data-lucide="camera" class="w-5 h-5"></i>
                            </button>
                            <label title="ترجمة ملف ترجمة (SRT)" class="p-2 text-slate-500 hover:text-blue-600 hover:bg-blue-50 rounded-lg cursor-pointer transition-all">
                                <i data-lucide="file-text" class="w-5 h-5"></i>
                                <input type="file" id="srtUpload" accept=".srt" class="hidden">
                            </label>
                        </div>
                        <span id="charCount" class="text-xs text-slate-400">0 / 5000</span>
                    </div>
                </div>

                <!-- Output -->
                <div class="glass p-6 rounded-3xl shadow-xl border border-slate-200 bg-slate-50 dark:bg-slate-800/50 relative">
                    <div id="outputText" class="w-full h-64 overflow-y-auto text-lg text-slate-700 dark:text-slate-200"></div>
                    <div class="flex justify-end gap-2 mt-4">
                        <button id="copyBtn" class="p-2 text-slate-500 hover:text-blue-600 hover:bg-blue-50 rounded-lg transition-all">
                            <i data-lucide="copy" class="w-5 h-5"></i>
                        </button>
                        <button id="speakBtn" class="p-2 text-slate-500 hover:text-blue-600 hover:bg-blue-50 rounded-lg transition-all">
                            <i data-lucide="volume-2" class="w-5 h-5"></i>
                        </button>
                    </div>
                </div>
            </div>

            <!-- Action Button -->
            <div class="flex justify-center">
                <button id="translateBtn" class="bg-blue-600 hover:bg-blue-700 text-white px-12 py-4 rounded-2xl font-bold text-xl shadow-lg shadow-blue-200 dark:shadow-none transform transition-all hover:scale-105 active:scale-95 flex items-center gap-3">
                    <span>ترجمة</span>
                    <i data-lucide="arrow-left" class="w-6 h-6"></i>
                </button>
            </div>
        </main>

        <!-- Camera Modal -->
        <div id="cameraModal" class="fixed inset-0 bg-black/80 z-50 hidden flex items-center justify-center p-4">
            <div class="bg-white dark:bg-slate-900 rounded-3xl p-6 max-w-2xl w-full">
                <div class="flex justify-between items-center mb-4">
                    <h3 class="text-xl font-bold">التعرف على النص عبر الكاميرا</h3>
                    <button id="closeCamera" class="p-2"><i data-lucide="x" class="w-6 h-6"></i></button>
                </div>
                <video id="video" class="w-full rounded-2xl bg-black" autoplay playsinline></video>
                <canvas id="canvas" class="hidden"></canvas>
                <div class="mt-6 flex justify-center">
                    <button id="captureBtn" class="bg-red-600 text-white p-4 rounded-full shadow-lg hover:bg-red-700">
                        <i data-lucide="aperture" class="w-8 h-8"></i>
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Initialize Lucide icons
        lucide.createIcons();

        // Theme Toggle
        const themeToggle = document.getElementById('themeToggle');
        const themeIcon = document.getElementById('themeIcon');
        const body = document.body;

        themeToggle.addEventListener('click', () => {
            body.classList.toggle('dark-mode');
            const isDark = body.classList.contains('dark-mode');
            themeIcon.setAttribute('data-lucide', isDark ? 'sun' : 'moon');
            lucide.createIcons();
        });

        // Elements
        const translateBtn = document.getElementById('translateBtn');
        const inputText = document.getElementById('inputText');
        const outputText = document.getElementById('outputText');
        const sourceLang = document.getElementById('sourceLang');
        const targetLang = document.getElementById('targetLang');
        const charCount = document.getElementById('charCount');

        // Character Count
        inputText.addEventListener('input', () => {
            charCount.textContent = `${inputText.value.length} / 5000`;
        });

        // Translate Logic
        translateBtn.addEventListener('click', async () => {
            if (!inputText.value.trim()) return;

            translateBtn.disabled = true;
            translateBtn.innerHTML = `<div class="loader w-6 h-6 border-4 border-white/30 rounded-full"></div> <span>جاري الترجمة...</span>`;

            try {
                const response = await fetch('/api/translate', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        text: inputText.value,
                        source: sourceLang.value,
                        target: targetLang.value
                    })
                });
                const data = await response.json();
                outputText.innerText = data.translated_text;
            } catch (error) {
                console.error('Error:', error);
                outputText.innerText = 'عذراً، حدث خطأ أثناء الترجمة.';
            } finally {
                translateBtn.disabled = false;
                translateBtn.innerHTML = `<span>ترجمة</span> <i data-lucide="arrow-left" class="w-6 h-6"></i>`;
                lucide.createIcons();
            }
        });

        // Subtitle Upload
        document.getElementById('srtUpload').addEventListener('change', async (e) => {
            const file = e.target.files[0];
            if (!file) return;

            const formData = new FormData();
            formData.append('file', file);
            formData.append('target', targetLang.value);

            outputText.innerText = 'جاري معالجة وترجمة ملف الترجمة...';
            
            try {
                const response = await fetch('/api/translate-srt', {
                    method: 'POST',
                    body: formData
                });
                const blob = await response.blob();
                const url = window.URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = `translated_${file.name}`;
                document.body.appendChild(a);
                a.click();
                a.remove();
                outputText.innerText = 'تمت ترجمة الملف وتحميله بنجاح!';
            } catch (error) {
                outputText.innerText = 'خطأ في ترجمة ملف SRT.';
            }
        });

        // Camera Logic
        const cameraBtn = document.getElementById('cameraBtn');
        const cameraModal = document.getElementById('cameraModal');
        const closeCamera = document.getElementById('closeCamera');
        const video = document.getElementById('video');
        const canvas = document.getElementById('canvas');
        const captureBtn = document.getElementById('captureBtn');

        cameraBtn.addEventListener('click', async () => {
            cameraModal.classList.remove('hidden');
            const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } });
            video.srcObject = stream;
        });

        closeCamera.addEventListener('click', () => {
            cameraModal.classList.add('hidden');
            const stream = video.srcObject;
            const tracks = stream.getTracks();
            tracks.forEach(track => track.stop());
        });

        captureBtn.addEventListener('click', async () => {
            const context = canvas.getContext('2d');
            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;
            context.drawImage(video, 0, 0, canvas.width, canvas.height);
            
            const imageData = canvas.toDataURL('image/jpeg');
            cameraModal.classList.add('hidden');
            outputText.innerText = 'جاري التعرف على النص...';

            try {
                const response = await fetch('/api/vision', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ image: imageData })
                });
                const data = await response.json();
                inputText.value = data.text;
                inputText.dispatchEvent(new Event('input'));
                outputText.innerText = 'تم استخراج النص، اضغط ترجمة الآن.';
            } catch (error) {
                outputText.innerText = 'فشل التعرف على النص.';
            }
        });

        // Copy & Speak
        document.getElementById('copyBtn').addEventListener('click', () => {
            navigator.clipboard.writeText(outputText.innerText);
            alert('تم النسخ!');
        });

        document.getElementById('speakBtn').addEventListener('click', () => {
            const utterance = new SpeechSynthesisUtterance(outputText.innerText);
            utterance.lang = targetLang.value === 'AR' ? 'ar-SA' : 'en-US';
            window.speechSynthesis.speak(utterance);
        });
    </script>
</body>
</html>
