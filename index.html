<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>HN TRANSLATOR</title>
    
    <!-- ربط ملف manifest.json -->
    <link rel="manifest" href="manifest.json">
    
    <!-- أيقونات التطبيق -->
    <link rel="apple-touch-icon" href="icon-192.png">
    <meta name="theme-color" content="#0a0a1a">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #0a0a1a;
        }
        
        iframe {
            width: 100%;
            height: 100%;
            border: none;
            background: #0a0a1a;
            display: block;
        }
        
        /* شاشة التحميل */
        #loading {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #0a0a1a;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            transition: opacity 0.8s ease;
            color: #4ECBA0;
            font-family: 'Space Grotesk', sans-serif;
        }
        
        #loading .logo {
            font-size: 32px;
            font-weight: 700;
            margin-bottom: 12px;
            letter-spacing: -0.02em;
        }
        
        #loading .spinner {
            width: 36px;
            height: 36px;
            border: 3px solid rgba(78,203,160,0.15);
            border-top: 3px solid #4ECBA0;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        
        /* إخفاء شاشة التحميل بعد تحميل الإطار */
        iframe.loaded + #loading {
            opacity: 0;
            pointer-events: none;
        }
    </style>
</head>
<body>

    <!-- الإطار الذي يعرض تطبيق Streamlit -->
    <iframe 
        src="https://dabaa-translator-k28lzdqqz3rlus8wy6un7t.streamlit.app/?embed=true" 
        onload="this.classList.add('loaded')"
        allow="microphone; camera; autoplay; encrypted-media"
    ></iframe>

    <!-- شاشة التحميل -->
    <div id="loading">
        <div class="logo">🌐 HN</div>
        <div class="spinner"></div>
    </div>

    <script>
        // إخفاء شاشة التحميل بعد 3 ثوانٍ كحل احتياطي
        setTimeout(() => {
            const loading = document.getElementById('loading');
            if (loading) loading.style.opacity = '0';
        }, 3000);

        // تسجيل Service Worker
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('/sw.js')
                .then(registration => console.log('✅ Service Worker registered'))
                .catch(error => console.log('❌ Service Worker registration failed:', error));
        }
    </script>
</body>
</html>
