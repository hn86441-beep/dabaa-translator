<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HN TRANSLATOR</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root{--c-ai:#4ECBA0;--c-dl:#6ea8fe;--c-go:#f4a261}
        *{box-sizing:border-box;margin:0;padding:0}
        body{background:linear-gradient(135deg,#07071a 0%,#0c1525 55%,#070f1a 100%);color:#F0F4FF;font-family:'Tajawal','Space Grotesk',sans-serif;min-height:100vh}
        .app{display:flex;min-height:100vh}
        .sidebar{width:300px;background:linear-gradient(180deg,#06061a 0%,#0a1020 60%,#070d1a 100%);border-left:1px solid rgba(78,203,160,.2);padding:20px;overflow-y:auto;position:sticky;top:0;height:100vh;flex-shrink:0}
        .main{flex:1;padding:30px 40px;max-width:1000px;margin:0 auto}
        .hdr{text-align:center;padding:15px 0}
        .hdr h1{font-size:32px;color:#F0F4FF;letter-spacing:-.02em;text-shadow:0 0 40px rgba(78,203,160,.22)}
        .hdr h1 .ac{color:#4ECBA0}
        .hdr .tags{display:flex;justify-content:center;gap:8px;margin-top:12px;flex-wrap:wrap}
        .hdr .tag{font-size:10px;background:rgba(78,203,160,.08);border:1px solid rgba(78,203,160,.2);border-radius:20px;padding:4px 12px;color:rgba(78,203,160,.78);display:flex;align-items:center;gap:4px}
        .lang-bar{display:flex;gap:10px;align-items:center;justify-content:center;background:rgba(78,203,160,.05);border:1px solid rgba(78,203,160,.2);border-radius:12px;padding:14px 20px;margin-bottom:24px;flex-wrap:wrap;position:relative;overflow:hidden}
        .lang-bar::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;background:linear-gradient(90deg,transparent,#4ECBA0,transparent)}
        .tabs{display:flex;gap:4px;border-bottom:1px solid rgba(78,203,160,.2);margin-bottom:24px;overflow-x:auto;padding-bottom:1px}
        .tab{padding:11px 18px;cursor:pointer;font-weight:600;color:#8fa8c8;border:none;background:transparent;border-radius:8px 8px 0 0;font-family:'Tajawal';font-size:13px;transition:.2s;display:flex;align-items:center;gap:6px;white-space:nowrap;border-bottom:2px solid transparent}
        .tab:hover{color:#F0F4FF;background:rgba(78,203,160,.03)}
        .tab.active{background:rgba(78,203,160,.08);color:#4ECBA0;border-bottom-color:#4ECBA0}
        .tc{display:none;animation:fadeIn .3s ease}.tc.active{display:block}
        @keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
        .card{background:rgba(78,203,160,.05);border:1px solid rgba(78,203,160,.2);border-radius:12px;padding:20px;margin-bottom:20px;position:relative;overflow:hidden}
        .card::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;background:linear-gradient(90deg,transparent,#4ECBA0,transparent)}
        textarea{width:100%;background:#0f1827;color:#F0F4FF;border:2px solid rgba(78,203,160,.2);border-radius:12px;padding:15px;font-size:16px;font-family:'Tajawal';resize:vertical;min-height:140px;transition:.2s}
        textarea:focus{outline:none;border-color:#4ECBA0;box-shadow:0 0 0 3px rgba(78,203,160,.13)}
        .t-panel{background:#0f1827;border:2px solid rgba(78,203,160,.2);border-radius:12px;padding:15px;min-height:90px;font-size:16px;line-height:1.8;font-weight:600;margin-top:12px;white-space:pre-wrap;transition:.2s}
        button{background:linear-gradient(135deg,#4ECBA0,#1a9d6a);color:#041510;font-weight:700;border:none;border-radius:10px;padding:10px 20px;cursor:pointer;transition:.2s;font-family:'Tajawal';font-size:13px;display:inline-flex;align-items:center;gap:6px}
        button:hover{filter:brightness(1.1);transform:translateY(-2px)}
        button:disabled{opacity:.4;cursor:not-allowed;transform:none;filter:none}
        .btn-s{background:transparent;border:1px solid rgba(78,203,160,.3);color:#4ECBA0}
        .btn-s:hover{background:rgba(78,203,160,.1)}
        select{background:#0f1827;color:#F0F4FF;border:1px solid rgba(78,203,160,.2);border-radius:8px;padding:10px 14px;font-family:'Tajawal';font-size:13px;cursor:pointer;transition:.2s}
        select:focus{outline:none;border-color:#4ECBA0}
        input[type=text]{background:#0f1827;color:#F0F4FF;border:1px solid rgba(78,203,160,.2);border-radius:10px;padding:10px 14px;font-family:'Tajawal';font-size:13px;transition:.2s}
        input[type=text]:focus{outline:none;border-color:#4ECBA0;box-shadow:0 0 0 2px rgba(78,203,160,.13)}
        .swap-btn{background:transparent;border:1px solid rgba(78,203,160,.3);color:#4ECBA0;padding:10px;border-radius:8px}
        .swap-btn:hover{background:rgba(78,203,160,.1);transform:scale(1.05)}
        .htl{background:rgba(78,203,160,.06);border:1px solid rgba(78,203,160,.2);border-right:3px solid #4ECBA0;border-radius:0 12px 12px 0;padding:12px;margin-bottom:10px;transition:.2s}
        .htl:hover{transform:translateX(-3px);box-shadow:-3px 4px 16px rgba(78,203,160,.1)}
        .htl-time{font-size:10px;opacity:.5;font-family:monospace}
        .htl-eng{font-size:10px;color:#4ECBA0}
        .htl-o{font-size:12px;opacity:.6;margin:4px 0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
        .htl-tr{font-size:14px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
        .chat-box{max-height:380px;overflow-y:auto;margin-bottom:14px;padding:10px;background:rgba(0,0,0,.1);border-radius:12px}
        .msg-u{text-align:right;background:rgba(78,203,160,.1);padding:10px 14px;border-radius:12px;margin-bottom:10px;margin-left:20%}
        .msg-a{text-align:right;background:rgba(255,255,255,.04);padding:10px 14px;border-radius:12px;margin-bottom:10px;margin-right:20%;border-right:3px solid #4ECBA0}
        .srt-line{display:flex;gap:12px;padding:8px 0;border-bottom:1px solid rgba(78,203,160,.1);font-size:13px}
        .rec-btn{background:#ff4444;color:white;border-radius:50%;width:60px;height:60px;font-size:20px;display:flex;align-items:center;justify-content:center;margin:10px auto;cursor:pointer;border:none;box-shadow:0 0 0 0 rgba(255,68,68,.7);animation:pulse 1.5s infinite;transition:.2s}
        .rec-btn.on{background:#4ECBA0;animation:none}
        @keyframes pulse{0%{box-shadow:0 0 0 0 rgba(255,68,68,.7)}70%{box-shadow:0 0 0 15px rgba(255,68,68,0)}100%{box-shadow:0 0 0 0 rgba(255,68,68,0)}}
        .loader{border:3px solid rgba(255,255,255,.1);border-top:3px solid #4ECBA0;border-radius:50%;width:18px;height:18px;animation:spin .8s linear infinite;display:inline-block;margin-left:6px;vertical-align:middle}
        @keyframes spin{to{transform:rotate(360deg)}}
        .status{margin-top:10px;font-size:13px;opacity:.7}
        .grp-card{background:rgba(78,203,160,.06);border:1px solid rgba(78,203,160,.2);border-radius:12px;padding:14px;margin-bottom:10px}
        .grp-card .meta{font-size:11px;opacity:.6;font-family:monospace;margin-bottom:4px}
        .grp-card .trans{font-weight:700;font-size:14px;margin-bottom:2px}
        .grp-card .orig{font-size:12px;opacity:.5}
        .actions{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
        .file-label{display:inline-flex;align-items:center;gap:6px}
        .section-title{display:flex;align-items:center;gap:8px;color:#4ECBA0;font-weight:700;margin-bottom:14px;font-size:15px}
        @media(max-width:900px){
            .sidebar{display:none}
            .main{padding:20px 16px}
        }
        ::-webkit-scrollbar{width:5px}
        ::-webkit-scrollbar-track{background:transparent}
        ::-webkit-scrollbar-thumb{background:rgba(78,203,160,.25);border-radius:3px}
        ::-webkit-scrollbar-thumb:hover{background:rgba(78,203,160,.4)}
    </style>
</head>
<body>
<div class="app">
    <div class="sidebar">
        <div style="color:#4ECBA0;letter-spacing:.1em;font-size:11px;margin-bottom:14px;font-weight:700">سجل المحفوظات</div>
        <div id="history-list"><div style="opacity:.3;text-align:center;padding:30px;font-size:13px">لا يوجد سجل بعد</div></div>
    </div>
    <div class="main">
        <div class="hdr">
            <h1>HN <span class="ac">TRANSLATOR</span></h1>
            <div class="tags">
                <span class="tag">🎙️ Voice</span><span class="tag">✍️ Text + AI</span>
                <span class="tag">📸 Vision</span><span class="tag">🎬 Subtitles</span><span class="tag">🌍 Group</span>
            </div>
        </div>
        <div class="lang-bar">
            <select id="src_lang"></select>
            <button class="swap-btn" onclick="swapLangs()">⇄</button>
            <select id="tgt_lang"></select>
        </div>
        <div class="tabs" id="tabs_bar"></div>
        <div id="tabs_content"></div>
    </div>
</div>
<script>
const API='';
const LANGS=["Auto-Detect","Arabic","English","Russian","Chinese","German","Spanish","French","Portuguese","Italian","Japanese","Korean","Turkish","Dutch","Polish","Ukrainian","Swedish","Danish","Finnish","Romanian","Hungarian","Czech","Bulgarian","Greek","Indonesian","Hindi","Persian","Hebrew","Urdu"];
const TTS_MAP={"Auto-Detect":"en",Arabic:"ar",English:"en",Russian:"ru",Chinese:"zh-cn",German:"de",Spanish:"es",French:"fr",Portuguese:"pt",Italian:"it",Japanese:"ja",Korean:"ko",Turkish:"tr",Dutch:"nl",Polish:"pl",Ukrainian:"uk",Swedish:"sv",Danish:"da",Finnish:"fi",Romanian:"ro",Hungarian:"hu",Czech:"cs",Bulgarian:"bg",Greek:"el",Indonesian:"id",Hindi:"hi",Persian:"fa",Hebrew:"iw",Urdu:"ur"};
const TABS=[{id:"text",icon:"✍️",label:"Text + AI"},{id:"voice",icon:"🎙️",label:"Voice"},{id:"file",icon:"📄",label:"File"},{id:"camera",icon:"📸",label:"Camera"},{id:"srt",icon:"🎬",label:"Subtitles"},{id:"group",icon:"🌍",label:"Group"}];

const srcSel=document.getElementById('src_lang');
const tgtSel=document.getElementById('tgt_lang');
LANGS.forEach(l=>{srcSel.add(new Option(l,l));if(l!=="Auto-Detect")tgtSel.add(new Option(l,l))});
srcSel.value="Auto-Detect";tgtSel.value="Arabic";

// Build tabs
const tabsBar=document.getElementById('tabs_bar');
const tabsContent=document.getElementById('tabs_content');
let activeTab="text";
function buildTabs(){
    tabsBar.innerHTML=TABS.map(t=>`<button class="tab ${t.id===activeTab?'active':''}" data-tab="${t.id}">${t.icon} ${t.label}</button>`).join('');
    tabsBar.querySelectorAll('.tab').forEach(btn=>btn.onclick=()=>{activeTab=btn.dataset.tab;buildTabs()});
    tabsContent.innerHTML=getTabHTML(activeTab);
    attachTabEvents(activeTab);
}
function getTabHTML(id){
    if(id==='text')return `
    <div class="tc active">
        <textarea id="input_text" placeholder="اكتب النص هنا..."></textarea>
        <div class="t-panel" id="t_panel">الترجمة تظهر هنا تلقائياً...</div>
        <div class="actions">
            <button onclick="speakText('t_panel')">🔊 استماع</button>
            <button class="btn-s" onclick="copyText('t_panel')">📋 نسخ</button>
        </div>
        <div class="card" style="margin-top:24px">
            <div class="section-title">🤖 مساعد الذكاء الاصطناعي</div>
            <div class="chat-box" id="chat_box"><div style="opacity:.3;text-align:center;padding:30px;font-size:13px">اسأل المساعد عن اللغات والترجمة...</div></div>
            <div style="display:flex;gap:8px">
                <input type="text" id="chat_input" placeholder="اسأل المساعد..." style="flex:1" onkeypress="if(event.key==='Enter')sendChat()">
                <button onclick="sendChat()">إرسال</button>
            </div>
        </div>
    </div>`;
    if(id==='voice')return `
    <div class="tc active">
        <div class="card" style="text-align:center">
            <div class="section-title" style="justify-content:center">🎙️ تسجيل صوتي مباشر</div>
            <button id="rec_btn" class="rec-btn" onclick="toggleRecording()">🎤</button>
            <p id="rec_status" class="status">اضغط على المايكروفون للبدء</p>
            <div class="t-panel" id="voice_panel" style="text-align:right">سيظهر النص والترجمة هنا...</div>
            <button onclick="speakText('voice_panel')" style="margin-top:10px">🔊 استماع للترجمة</button>
        </div>
    </div>`;
    if(id==='file')return `
    <div class="tc active">
        <div class="card">
            <div class="section-title">📄 ترجمة الملفات</div>
            <div class="file-label"><label class="btn-s" style="padding:10px 20px;cursor:pointer;border-radius:10px;font-weight:700;font-size:13px">📄 اختر ملف<input type="file" id="doc_file" accept=".txt,.pdf,.docx,.xlsx,.xls" style="display:none" onchange="translateFile()"></label></div>
            <span style="font-size:11px;opacity:.5;margin-right:8px">PDF, DOCX, XLSX, TXT</span>
            <p id="file_status" class="status"></p>
            <div class="t-panel" id="file_panel" style="max-height:300px;overflow-y:auto;margin-top:12px">ترجمة الملف ستظهر هنا...</div>
        </div>
    </div>`;
    if(id==='camera')return `
    <div class="tc active">
        <div class="card">
            <div class="section-title">📸 استخراج نص من صورة</div>
            <div class="file-label"><label class="btn-s" style="padding:10px 20px;cursor:pointer;border-radius:10px;font-weight:700;font-size:13px">📸 اختر صورة<input type="file" id="img_file" accept="image/*" style="display:none" onchange="ocrImage()"></label></div>
            <p id="ocr_status" class="status"></p>
            <div class="t-panel" id="ocr_panel" style="margin-top:12px">النص المستخرج والترجمة سيظهرون هنا...</div>
        </div>
    </div>`;
    if(id==='srt')return `
    <div class="tc active">
        <div class="card">
            <div class="section-title">🎬 ترجمة الفيديو (SRT)</div>
            <div class="file-label"><label class="btn-s" style="padding:10px 20px;cursor:pointer;border-radius:10px;font-weight:700;font-size:13px">🎬 اختر ملف صوت/فيديو<input type="file" id="video_file" accept="audio/*,video/*" style="display:none" onchange="generateSRT()"></label></div>
            <p id="srt_status" class="status"></p>
            <div id="srt_output" style="margin-top:12px"></div>
        </div>
    </div>`;
    if(id==='group')return `
    <div class="tc active">
        <div class="card">
            <div class="section-title">🌍 ترجمة محادثات جماعية</div>
            <div class="file-label"><label class="btn-s" style="padding:10px 20px;cursor:pointer;border-radius:10px;font-weight:700;font-size:13px">🌍 اختر ملف صوتي<input type="file" id="group_file" accept="audio/*" style="display:none" onchange="analyzeGroup()"></label></div>
            <p id="group_status" class="status"></p>
            <div id="group_output" style="margin-top:12px"></div>
        </div>
    </div>`;
    return '';
}

function attachTabEvents(id){
    if(id==='text'){
        const ta=document.getElementById('input_text');
        if(ta)ta.oninput=()=>translateText();
    }
}

function swapLangs(){let s=srcSel.value,t=tgtSel.value;srcSel.value=t;tgtSel.value=s==="Auto-Detect"?"Arabic":s;translateText()}

let translateTimeout;
async function translateText(){
    clearTimeout(translateTimeout);
    const ta=document.getElementById('input_text');if(!ta)return;
    const text=ta.value.trim();if(text.length<3){document.getElementById('t_panel').innerText='الترجمة تظهر هنا تلقائياً...';return}
    const panel=document.getElementById('t_panel');panel.innerHTML='<span class="loader"></span> جاري الترجمة...';
    translateTimeout=setTimeout(async()=>{
        try{const r=await fetch(API+'/translate',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({text,tgt:tgtSel.value,src:srcSel.value})});
        const d=await r.json();
        if(d.trans){panel.innerText=d.trans;if(d.eng)panel.innerHTML+='<br><span style="font-size:10px;opacity:.35">via '+d.eng+'</span>';saveHistory(text,d.trans,tgtSel.value,d.eng)}
        else panel.innerText="تعذر الترجمة."}catch{panel.innerText="خطأ في الاتصال."}},500)}

async function sendChat(){
    const inp=document.getElementById('chat_input');const msg=inp.value.trim();if(!msg)return;inp.value='';
    const box=document.getElementById('chat_box');
    const placeholder=box.querySelector('div[style]');if(placeholder)placeholder.remove();
    box.innerHTML+='<div class="msg-u">'+msg+'</div>';box.scrollTop=box.scrollHeight;
    try{const r=await fetch(API+'/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({msg})});
    const d=await r.json();box.innerHTML+='<div class="msg-a">'+(d.ans||'حدث خطأ.')+'</div>';box.scrollTop=box.scrollHeight}catch{box.innerHTML+='<div class="msg-a" style="color:#f55">خطأ في الشبكة.</div>'}}

async function speakText(id){const t=document.getElementById(id).innerText;if(!t||t.includes('...'))return;try{const r=await fetch(API+'/tts',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({text:t.slice(0,500),lang:TTS_MAP[tgtSel.value]||'en'})});const d=await r.json();if(d.audio)new Audio('data:audio/mp3;base64,'+d.audio).play()}catch{}}

function copyText(id){navigator.clipboard.writeText(document.getElementById(id).innerText);const btn=event.target;const orig=btn.innerText;btn.innerText='تم!';setTimeout(()=>btn.innerText=orig,1500)}

let mediaRecorder,audioChunks=[];
async function toggleRecording(){
    const btn=document.getElementById('rec_btn'),st=document.getElementById('rec_status');
    if(mediaRecorder&&mediaRecorder.state==='recording'){mediaRecorder.stop();btn.classList.remove('on');st.innerText='جاري معالجة الصوت...'}
    else{try{const stream=await navigator.mediaDevices.getUserMedia({audio:true});mediaRecorder=new MediaRecorder(stream);audioChunks=[];mediaRecorder.ondataavailable=e=>audioChunks.push(e.data);mediaRecorder.onstop=sendAudio;mediaRecorder.start();btn.classList.add('on');st.innerText='🔴 جاري التسجيل... اضغط للإيقاف'}catch{st.innerText='❌ لا يمكن الوصول إلى المايكروفون.'}}}
async function sendAudio(){
    const blob=new Blob(audioChunks,{type:'audio/webm'});const file=new File([blob],'audio.webm',{type:'audio/webm'});
    const fd=new FormData();fd.append('file',file);fd.append('lang',srcSel.value);const st=document.getElementById('rec_status');
    try{st.innerText='جاري التعرف...';const r=await fetch(API+'/stt',{method:'POST',body:fd});const d=await r.json();
    if(d.txt){st.innerText='جاري الترجمة...';const tr=await fetch(API+'/translate',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({text:d.txt,tgt:tgtSel.value,src:srcSel.value})});const td=await tr.json();
    document.getElementById('voice_panel').innerHTML='<b>النص الأصلي:</b> '+d.txt+'<br><br><b>الترجمة:</b> '+(td.trans||'تعذر الترجمة');if(td.trans)saveHistory(d.txt,td.trans,tgtSel.value,td.eng);st.innerText='✅ تم!'}
    else st.innerText='❌ لم يتم التعرف على الكلام.'}catch{st.innerText='❌ خطأ في الاتصال.'}}

async function translateFile(){
    const f=document.getElementById('doc_file').files[0];if(!f)return;const st=document.getElementById('file_status');const panel=document.getElementById('file_panel');
    st.innerText='⏳ جاري استخراج النص...';panel.innerText='';const fd=new FormData();fd.append('file',f);
    try{const r=await fetch(API+'/extract',{method:'POST',body:fd});const ed=await r.json();
    if(!ed.txt){st.innerText='❌ '+(ed.err||'خطأ');return}
    st.innerText='⏳ جاري ترجمة...';const tr=await fetch(API+'/translate',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({text:ed.txt,tgt:tgtSel.value,src:srcSel.value})});const td=await tr.json();
    panel.innerText=td.trans||'تعذر الترجمة';if(td.trans)saveHistory(ed.txt.slice(0,100),td.trans.slice(0,100),tgtSel.value,td.eng);st.innerText='✅ تم!'}catch{st.innerText='❌ خطأ.'}}

async function ocrImage(){
    const f=document.getElementById('img_file').files[0];if(!f)return;const st=document.getElementById('ocr_status');const panel=document.getElementById('ocr_panel');
    st.innerText='⏳ جاري استخراج النص...';panel.innerText='';const fd=new FormData();fd.append('file',f);
    try{const r=await fetch(API+'/ocr',{method:'POST',body:fd});const d=await r.json();
    if(d.txt){st.innerText='⏳ جاري الترجمة...';const tr=await fetch(API+'/translate',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({text:d.txt,tgt:tgtSel.value,src:srcSel.value})});const td=await tr.json();
    panel.innerHTML='<b>النص المستخرج:</b> '+d.txt+'<br><br><b>الترجمة:</b> '+(td.trans||'تعذر الترجمة');if(td.trans)saveHistory(d.txt.slice(0,100),td.trans.slice(0,100),tgtSel.value,td.eng);st.innerText='✅ تم!'}
    else st.innerText='❌ '+(d.err||'فشل')}catch{st.innerText='❌ خطأ.'}}

async function generateSRT(){
    const f=document.getElementById('video_file').files[0];if(!f)return;const st=document.getElementById('srt_status');const out=document.getElementById('srt_output');
    st.innerText='⏳ جاري التحليل (قد يستغرق وقتاً)...';out.innerHTML='';const fd=new FormData();fd.append('file',f);fd.append('tgt',tgtSel.value);
    try{const r=await fetch(API+'/srt',{method:'POST',body:fd});const d=await r.json();
    if(d.blocks){st.innerText='✅ تم استخراج '+d.blocks.length+' مقطع.';out.innerHTML=d.blocks.map(b=>'<div class="srt-line"><span style="opacity:.4;width:30px;text-align:center">'+b.num+'</span><span style="opacity:.6;font-family:monospace;font-size:12px;width:50px">'+b.start.toFixed(1)+'s</span><span style="flex:1;font-weight:600">'+b.trans+'</span></div>').join('')}
    else st.innerText='❌ '+(d.err||'فشل')}catch{st.innerText='❌ خطأ.'}}

async function analyzeGroup(){
    const f=document.getElementById('group_file').files[0];if(!f)return;const st=document.getElementById('group_status');const out=document.getElementById('group_output');
    st.innerText='⏳ جاري التحليل...';out.innerHTML='';const fd=new FormData();fd.append('file',f);fd.append('tgt',tgtSel.value);
    try{const r=await fetch(API+'/group',{method:'POST',body:fd});const d=await r.json();
    if(d.results){st.innerText='✅ تم تحليل '+d.results.length+' مقطع.';out.innerHTML=d.results.map(r=>'<div class="grp-card"><div class="meta">'+r.t0.toFixed(1)+'s - '+r.t1.toFixed(1)+'s'+(r.eng?' &middot; <span style="color:#4ECBA0">via '+r.eng+'</span>':'')+'</div><div class="trans">'+(r.trans||'—')+'</div><div class="orig">'+r.orig+'</div></div>').join('')}
    else st.innerText='❌ '+(d.err||'فشل')}catch{st.innerText='❌ خطأ.'}}

function saveHistory(orig,trans,tgt,eng){let h=JSON.parse(localStorage.getItem('hn_hist')||'[]');h.unshift({orig,trans,tgt,eng,time:new Date().toLocaleString('ar-EG')});if(h.length>60)h.length=60;localStorage.setItem('hn_hist',JSON.stringify(h));renderHistory()}
function renderHistory(){let h=JSON.parse(localStorage.getItem('hn_hist')||'[]');const el=document.getElementById('history-list');
el.innerHTML=h.length?h.map((item,i)=>'<div class="htl"><div style="display:flex;justify-content:space-between"><span class="htl-eng">'+item.eng+'</span><span class="htl-time">'+item.time+'</span></div><div class="htl-o">'+item.orig+'</div><div class="htl-tr">'+item.trans+'</div><button class="btn-s" style="font-size:10px;padding:2px 8px;margin-top:5px" onclick="deleteHist('+i+')">حذف</button></div>').join(''):'<div style="opacity:.3;text-align:center;padding:30px;font-size:13px">لا يوجد سجل بعد</div>'}
function deleteHist(i){let h=JSON.parse(localStorage.getItem('hn_hist')||'[]');h.splice(i,1);localStorage.setItem('hn_hist',JSON.stringify(h));renderHistory()}
renderHistory();buildTabs();
</script>
